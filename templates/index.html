<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Управление заказами</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 font-sans antialiased h-screen flex flex-col">

    <!-- Верхняя панель -->
    <header class="bg-blue-600 text-white p-4 shadow-md flex justify-between items-center z-10">
        <h1 class="text-xl font-bold">Мои заказы</h1>
        <button id="logoutBtn" class="text-sm font-medium bg-blue-700 px-3 py-1 rounded-lg hidden">Выйти</button>
    </header>

    <!-- Основной контент -->
    <main class="flex-1 overflow-y-auto p-4" id="mainContent">
        <div class="flex items-center justify-center h-full">
            <p class="text-gray-500 text-center">Загрузка интерфейса...</p>
        </div>
    </main>

    <!-- Кнопка плюс -->
    <button class="absolute bottom-6 right-6 bg-blue-600 text-white w-14 h-14 rounded-full shadow-lg flex items-center justify-center text-3xl hover:bg-blue-700 transition hidden" id="fabAdd">
        +
    </button>

    <!-- Наш JavaScript -->
    <script>
        async function loadApp() {
            const main = document.getElementById('mainContent');
            
            try {
                // Идем на бэкенд за заказами
                const response = await fetch('/api/orders');
                
                // Если сервер просит пароль (ошибка 401)
                if (response.status === 401 || response.status === 403) {
                    main.innerHTML = `
                        <div class="flex flex-col items-center justify-center h-full">
                            <p class="text-gray-500 mb-4">Для просмотра заказов нужно войти в систему</p>
                            <button class="bg-blue-600 text-white px-6 py-2 rounded-lg font-medium shadow-md hover:bg-blue-700">Войти</button>
                        </div>
                    `;
                    return;
                }
                
                if (!response.ok) throw new Error('Ошибка сети');
                
                const orders = await response.json();
                
                // Если заказов нет
                if (!orders || orders.length === 0) {
                    main.innerHTML = '<div class="flex items-center justify-center h-full"><p class="text-gray-500">У вас пока нет заказов</p></div>';
                    return;
                }
                
                // Рисуем карточки заказов
                let html = '<div class="space-y-4">';
                orders.forEach(order => {
                    html += `
                        <div class="bg-white p-4 rounded-xl shadow-sm border border-gray-100">
                            <div class="flex justify-between items-start mb-2">
                                <h3 class="font-bold text-gray-800">Заказ #${order.id || '?'}</h3>
                                <span class="text-xs font-bold px-2 py-1 rounded-full bg-blue-100 text-blue-700">${order.status || 'Новый'}</span>
                            </div>
                            <p class="text-sm text-gray-600">${order.description || 'Нет описания'}</p>
                        </div>
                    `;
                });
                html += '</div>';
                
                main.innerHTML = html;
                
            } catch (error) {
                main.innerHTML = '<div class="flex items-center justify-center h-full"><p class="text-red-500">Ошибка подключения к серверу</p></div>';
            }
        }

        // Запускаем скрипт сразу после загрузки страницы
        loadApp();
    </script>
</body>
</html>
