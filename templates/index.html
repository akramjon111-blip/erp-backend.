<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Управление заказами</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 font-sans antialiased h-screen flex flex-col relative">

    <!-- Верхняя панель (теперь с кнопкой плюса справа) -->
    <header class="bg-blue-600 text-white p-4 shadow-md flex justify-between items-center z-10">
        <h1 class="text-xl font-bold">Мои заказы</h1>
        <button id="fabAdd" class="bg-blue-700 hover:bg-blue-800 text-white w-9 h-9 rounded-full font-bold text-xl flex items-center justify-center transition shadow-sm">
            +
        </button>
    </header>

    <!-- Основной контент -->
    <main class="flex-1 overflow-y-auto p-4" id="mainContent">
        <div class="flex items-center justify-center h-full">
            <p class="text-gray-500 text-center">Загрузка интерфейса...</p>
        </div>
    </main>

    <!-- Модальное окно создания заказа -->
    <div id="orderModal" class="fixed inset-0 bg-black bg-opacity-50 hidden flex items-center justify-center z-50">
        <div class="bg-white p-5 rounded-xl w-11/12 max-w-md shadow-2xl">
            <h2 class="text-lg font-bold mb-4">Новый заказ</h2>
            <form id="orderForm" class="space-y-3">
                
                <div class="grid grid-cols-2 gap-2">
                    <div>
                        <label class="block text-xs text-gray-500 mb-1">Откуда (Отдел)</label>
                        <input type="text" id="reqDept" required class="w-full border border-gray-300 rounded-lg p-2 text-sm" placeholder="Отдел продаж">
                    </div>
                    <div>
                        <label class="block text-xs text-gray-500 mb-1">Куда (Склад)</label>
                        <input type="text" id="execDept" required class="w-full border border-gray-300 rounded-lg p-2 text-sm" placeholder="Склад">
                    </div>
                </div>
                
                <hr class="my-2 border-gray-100">
                <h3 class="font-bold text-sm text-gray-700">Что заказываем?</h3>
                
                <div>
                    <label class="block text-xs text-gray-500 mb-1">Название товара</label>
                    <input type="text" id="itemName" required class="w-full border border-gray-300 rounded-lg p-2 text-sm" placeholder="Например: Ноутбук">
                </div>
                
                <div class="grid grid-cols-3 gap-2">
                    <div class="col-span-1">
                        <label class="block text-xs text-gray-500 mb-1">Код</label>
                        <input type="text" id="itemCode" required class="w-full border border-gray-300 rounded-lg p-2 text-sm" placeholder="LAP-1">
                    </div>
                    <div class="col-span-1">
                        <label class="block text-xs text-gray-500 mb-1">Кол-во</label>
                        <input type="number" id="itemQty" required min="1" class="w-full border border-gray-300 rounded-lg p-2 text-sm" value="1">
                    </div>
                    <div class="col-span-1">
                        <label class="block text-xs text-gray-500 mb-1">Ед. изм.</label>
                        <input type="text" id="itemUnit" required class="w-full border border-gray-300 rounded-lg p-2 text-sm" value="шт">
                    </div>
                </div>
                
                <div class="flex justify-end space-x-2 mt-4 pt-4 border-t border-gray-100">
                    <button type="button" id="closeModalBtn" class="px-4 py-2 text-sm font-medium text-gray-600 bg-gray-100 rounded-lg hover:bg-gray-200">Отмена</button>
                    <button type="submit" class="px-4 py-2 text-sm font-medium text-white bg-blue-600 rounded-lg hover:bg-blue-700">Отправить</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Наш JavaScript -->
    <script>
        const modal = document.getElementById('orderModal');
        const fabAdd = document.getElementById('fabAdd');
        const closeModalBtn = document.getElementById('closeModalBtn');
        const orderForm = document.getElementById('orderForm');

        // Открыть окно
        fabAdd.addEventListener('click', () => {
            modal.classList.remove('hidden');
        });

        // Закрыть окно
        closeModalBtn.addEventListener('click', () => {
            modal.classList.add('hidden');
            orderForm.reset();
        });

        // Отправка формы на сервер
        orderForm.addEventListener('submit', async (e) => {
            e.preventDefault(); 
            
            const newOrder = {
                id: Math.floor(Math.random() * 10000).toString(), 
                requesting_dept_id: document.getElementById('reqDept').value,
                executing_dept_id: document.getElementById('execDept').value,
                items: [
                    {
                        material_code: document.getElementById('itemCode').value,
                        name: document.getElementById('itemName').value,
                        unit: document.getElementById('itemUnit').value,
                        requested_quantity: parseInt(document.getElementById('itemQty').value),
                        stock_balance: 0,
                        allow_analog: true
                    }
                ]
            };

            try {
                const response = await fetch('/api/orders', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(newOrder)
                });

                if (response.ok) {
                    modal.classList.add('hidden'); 
                    orderForm.reset();             
                    loadApp();                     
                } else {
                    alert('Ошибка при создании заказа на сервере');
                }
            } catch (error) {
                alert('Ошибка сети. Проверьте подключение.');
            }
        });

        // Загрузка заказов
        async function loadApp() {
            const main = document.getElementById('mainContent');
            
            try {
                const response = await fetch('/api/orders');
                
                if (response.status === 401 || response.status === 403) {
                    main.innerHTML = '<div class="flex flex-col items-center justify-center h-full"><p class="text-gray-500 mb-4">Для просмотра заказов нужно войти в систему</p><button class="bg-blue-600 text-white px-6 py-2 rounded-lg font-medium shadow-md hover:bg-blue-700">Войти</button></div>';
                    return;
                }
                
                if (!response.ok) throw new Error('Ошибка сети');
                
                const orders = await response.json();
                
                if (!orders || orders.length === 0) {
                    main.innerHTML = '<div class="flex items-center justify-center h-full"><p class="text-gray-500">У вас пока нет заказов</p></div>';
                    return;
                }
                
                let html = '<div class="space-y-4">';
                orders.forEach(order => {
                    
                    let itemsHtml = '';
                    if (order.items && order.items.length > 0) {
                        itemsHtml = '<div class="mt-3 pt-3 border-t border-gray-100 space-y-2">';
                        order.items.forEach(item => {
                            itemsHtml += '<div class="flex justify-between text-sm"><span class="text-gray-700">' + (item.name || item.material_code) + '</span><span class="font-medium text-gray-900">' + item.requested_quantity + ' ' + item.unit + '</span></div>';
                        });
                        itemsHtml += '</div>';
                    } else {
                        itemsHtml = '<p class="mt-3 pt-3 border-t border-gray-100 text-sm text-gray-400 italic">Нет товаров</p>';
                    }

                    html += '<div class="bg-white p-4 rounded-xl shadow-sm border border-gray-100"><div class="flex justify-between items-start mb-2"><div><h3 class="font-bold text-gray-800">Заказ #' + (order.id || '?') + '</h3><p class="text-xs text-gray-500 mt-1">' + (order.requesting_dept_id || 'Отдел не указан') + ' ➔ ' + (order.executing_dept_id || 'Склад не указан') + '</p></div><span class="text-xs font-bold px-2 py-1 rounded-full bg-blue-100 text-blue-700">' + (order.status || 'Новый') + '</span></div>' + itemsHtml + '</div>';
                });
                html += '</div>';
                
                main.innerHTML = html;
                
            } catch (error) {
                main.innerHTML = '<div class="flex items-center justify-center h-full"><p class="text-red-500">Ошибка подключения к серверу</p></div>';
            }
        }

        loadApp();
    </script>
</body>
</html>
